# Videoflix production stack. Starts only published images pinned by digest: no build, no source mounts.
# One commit in this repository = one running combination of backend and frontend.
# TLS and routing: vps-edge (Caddy) reaches web and frontend over the external network "edge".
name: videoflix

# journald, because json-file only rotates by size: the 14-day limit in the privacy policy needs a time limit.
# Retention is set on the host, see vps-edge (host/journald-retention.conf).
x-logging: &logging
  driver: journald

x-backend: &backend
  # Last digest that passed the deploy workflow; the server may be ahead via compose.override.yaml until the pin PR is merged.
  image: ${BACKEND_IMAGE:-ghcr.io/philippklinger/videoflix-backend@sha256:66af49e38261974667b3f4d105e49d35f9d3174b28e1e28fef8e2c195facd509}
  env_file: [.env]
  volumes:
    - media:/app/media
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # Postgres 18 keeps its data below /var/lib/postgresql/18
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  redis:
    # Cache, rate limits and job queue; nothing here needs to survive a restart
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  web:
    <<: *backend
    command: ["web"]
    # The VPS is shared with other stacks: a crafted upload must not take it down
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    ports:
      # Admin only through an SSH tunnel; vps-edge returns 404 for /admin/. Never bind to 0.0.0.0: Docker bypasses ufw
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Django only answers hosts from ALLOWED_HOSTS; /api/health/ is exempt from the HTTPS redirect
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as r; h = os.environ['ALLOWED_HOSTS'].split(',')[0]; r.urlopen(r.Request('http://127.0.0.1:8000/api/health/', headers={'Host': h}), timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      internal:
      edge:
        aliases: [videoflix-web]

  worker:
    # Exactly one worker: ffmpeg conversions run one after another
    <<: *backend
    command: ["worker"]
    # ffmpeg peaks here; an upload that hits the limit fails, the other stacks keep running
    mem_limit: 6g
    cpus: 3
    pids_limit: 256
    depends_on:
      web:
        condition: service_healthy
    networks: [internal]

  mail-worker:
    # Sends account mails: the only worker with a route outside, so ffmpeg stays without one
    <<: *backend
    command: ["mail-worker"]
    volumes: []
    depends_on:
      web:
        condition: service_healthy
    networks: [internal, outbound]

  demo-cleanup:
    # Deletes expired demo accounts and their videos every 10 minutes (login checks expiry as well)
    <<: *backend
    command: ["sh", "-c", "while true; do python manage.py delete_expired_demos; sleep 600; done"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      web:
        condition: service_healthy
    networks: [internal]

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/philippklinger/videoflix-frontend@sha256:6a93d6959e6157773fd574dedcda3a0f6e528b978ec2efddd0058badee09e09b}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging
    networks:
      edge:
        aliases: [videoflix-frontend]

networks:
  # Database and Redis have no route to the outside
  internal:
    internal: true
  # Route outside for SMTP, without access to the other stacks on "edge"
  outbound:
  edge:
    external: true

volumes:
  db_data:
  media:
